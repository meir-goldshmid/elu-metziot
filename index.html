<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf5">
<meta name="description" content="מסע המציאות – לומדים גמרא פרק אלו מציאות בדרך כיפית ומשחקית">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>מסע המציאות – פרק אלו מציאות</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Frank+Ruhl+Libre:wght@500;700;900&family=Secular+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden">
    <button id="tb-home" class="tb-btn" aria-label="למפה">🗺️</button>
    <div class="tb-stat" id="tb-coins">🪙 <b>0</b></div>
    <div class="tb-stat" id="tb-stars">⭐ <b>0</b></div>
    <span class="tb-sp"></span>
    <button id="tb-shop" class="tb-btn" aria-label="חנות">🛍️</button>
    <button id="tb-sound" class="tb-btn" aria-label="צליל">🔊</button>
    <button id="tb-set" class="tb-btn" aria-label="הגדרות">⚙️</button>
  </header>
  <main id="screen" class="screen"></main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>
<div id="modal" class="hidden"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
